[package]
name = "poly"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "1", default-features = false, features = ["reqwest", "reqwest-rustls-tls", "signer-local", "signers"] }
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
polymarket-client-sdk = { version = "0.4", features = ["clob", "ctf", "ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
